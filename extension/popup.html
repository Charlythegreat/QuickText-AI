<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickText AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
          <span class="logo-text" data-i18n="popup.title">QuickText AI</span>
        </div>
      </div>
      
      <div class="header-right">
        <!-- Language Selector -->
        <div class="language-selector">
          <select id="language-select" class="language-dropdown" aria-label="Select language">
            <!-- Populated by JavaScript -->
          </select>
        </div>
      </div>
    </header>

    <!-- Input Section -->
    <section class="input-section">
      <label for="input-text" class="section-label" data-i18n="popup.inputLabel">Selected text or prompt</label>
      <div class="textarea-wrapper">
        <textarea 
          id="input-text" 
          class="input-textarea"
          data-i18n-placeholder="popup.inputPlaceholder"
          placeholder="Paste or type text here..."
          rows="4"
        ></textarea>
        <button id="paste-btn" class="icon-btn paste-btn" title="Paste from clipboard" aria-label="Paste">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
      <span id="char-count" class="char-count">0 / 10000</span>
    </section>

    <!-- Quick Action Buttons -->
    <section class="actions-section">
      <label class="section-label" data-i18n="popup.actionsLabel">Quick actions</label>
      <div class="action-buttons-grid">
        <button class="action-btn" data-action="rewrite" data-i18n="popup.actionRewrite">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          <span>Rewrite</span>
        </button>
        
        <button class="action-btn" data-action="polite" data-i18n="popup.actionPolite">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span>Polite reply</span>
        </button>
        
        <button class="action-btn" data-action="professional" data-i18n="popup.actionProfessional">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <span>Professional</span>
        </button>
        
        <button class="action-btn" data-action="short" data-i18n="popup.actionShort">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="21" y1="10" x2="3" y2="10"/>
            <line x1="21" y1="6" x2="3" y2="6"/>
            <line x1="15" y1="14" x2="3" y2="14"/>
          </svg>
          <span>Short reply</span>
        </button>
      </div>
    </section>

    <!-- Output Section -->
    <section class="output-section" id="output-section" hidden>
      <label class="section-label" data-i18n="popup.outputLabel">Generated response</label>
      <div class="output-wrapper">
        <textarea 
          id="output-text" 
          class="output-textarea"
          data-i18n-placeholder="popup.outputPlaceholder"
          placeholder="AI response will appear here..."
          rows="5"
          readonly
        ></textarea>
        
        <!-- Output Actions -->
        <div class="output-actions">
          <button id="copy-btn" class="icon-btn" title="Copy to clipboard" aria-label="Copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <button id="insert-btn" class="icon-btn" title="Insert into page" aria-label="Insert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19V5M5 12l7-7 7 7"/>
            </svg>
          </button>
          <button id="regenerate-btn" class="icon-btn" title="Regenerate" aria-label="Regenerate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Loading State -->
    <div id="loading-state" class="loading-state" hidden>
      <div class="loading-spinner"></div>
      <span class="loading-text" data-i18n="messages.generating">Generating...</span>
    </div>

    <!-- Error State -->
    <div id="error-state" class="error-state" hidden>
      <svg class="error-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="error-message" class="error-text"></span>
      <button id="retry-btn" class="retry-btn" data-i18n="popup.retryButton">Retry</button>
    </div>

    <!-- Status Toast -->
    <div id="status-toast" class="status-toast" hidden aria-live="polite"></div>

    <!-- Footer -->
    <footer class="footer">
      <button id="settings-btn" class="footer-link" data-i18n="popup.settingsButton">
        <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Settings
      </button>
      
      <span class="footer-text" data-i18n="popup.freeUnlimited">Free & Unlimited</span>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="i18n.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
